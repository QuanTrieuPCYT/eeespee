esphome:
  name: desk-lamp
  friendly_name: Desk Lamp

esp32:
  variant: esp32
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
    advanced:
      compiler_optimization: PERF
      minimum_chip_revision: 1.1
      sram1_as_iram: true
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  fast_connect: true
  power_save_mode: none

udp:
  - port: !secret controller_port
    addresses:
      - !secret controller_ip

globals:
  - id: ignore_climate_action
    type: bool
    initial_value: 'false'

  - id: last_knob_value
    type: int
    initial_value: '0'

binary_sensor:
  - platform: gpio
    id: button
    pin:
      inverted: true
      mode: INPUT_PULLDOWN
      number: GPIO33
    on_press:
      - lambda: 'id(ignore_climate_action) = false;'
    on_multi_click:
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.4s
        then:
          - light.toggle:
              id: desk_lamp
              transition_length: 0.2s

      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.4s
          - ON for at most 0.4s
          - OFF for at least 0.4s
        then:
          - udp.write: "bulbs"

      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.4s
          - ON for at most 0.4s
          - OFF for at most 0.4s
          - ON for at most 0.4s
          - OFF for at least 0.4s
        then:
          - udp.write: "led"

      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.4s
          - ON for at most 0.4s
          - OFF for at most 0.4s
          - ON for at most 0.4s
          - OFF for at most 0.4s
          - ON for at most 0.4s
          - OFF for at least 0.4s
        then:
          - udp.write: "rgb"

      - timing:
          - ON for at least 1.5s
        then:
          - if:
              condition:
                lambda: 'return !id(ignore_climate_action);'
              then:
                - udp.write: "climate"

  - platform: gpio
    id: reset_button
    pin:
      inverted: true
      mode: INPUT_PULLDOWN
      number: GPIO16

sensor:
  - platform: rotary_encoder
    id: knob
    on_value:
      then:
        - if:
            condition:
              light.is_on: desk_lamp
            then:
              - lambda: |-
                  int delta = x - id(last_knob_value);
                  id(last_knob_value) = x;
                  if (delta == 0) return;
                  if (id(button).state) {
                    id(ignore_climate_action) = true;
                    float min_temp = id(desk_lamp).get_traits().get_min_mireds();
                    float max_temp = id(desk_lamp).get_traits().get_max_mireds();
                    float cur_temp = id(desk_lamp).current_values.get_color_temperature();
                    float new_temp = std::max(min_temp, std::min(max_temp, cur_temp + (delta * 15.0f)));
                    auto call = id(desk_lamp).turn_on();
                    call.set_color_temperature(new_temp);
                    call.perform();
                  } else {
                    float cur_bright = id(desk_lamp).current_values.get_brightness();
                    float new_bright = cur_bright + (delta * 0.05f); 
                    if (new_bright < 0.01) new_bright = 0.01;
                    if (new_bright > 1.0) new_bright = 1.0;
                    auto call = id(desk_lamp).turn_on();
                    call.set_brightness(new_bright);
                    call.perform();
                  }
    pin_a: GPIO27
    pin_b: GPIO26
    resolution: 2

power_supply:
  - id: power
    enable_time: 0s
    keep_on_time: 0s
    pin:
      number: GPIO12
      ignore_strapping_warning: true

output:
  - platform: ledc
    id: cold_white
    frequency: 40000Hz
    min_power: 0.00027
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    power_supply: power
    zero_means_zero: true

  - platform: ledc
    id: warm_white
    frequency: 40000Hz
    pin: GPIO4
    power_supply: power

light:
  - platform: cwww
    id: desk_lamp
    name: Desk Lamp
    cold_white: cold_white
    cold_white_color_temperature: 5000K
    warm_white: warm_white
    warm_white_color_temperature: 2600K
    gamma_correct: 0
    default_transition_length: 0.2s
    restore_mode: RESTORE_DEFAULT_OFF